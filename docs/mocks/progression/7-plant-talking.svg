<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040"><rect width="1600" height="1040" fill="#121823"/><text x="40" y="62" font-size="34" fill="#e6e9ef" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Plant manager: how do you keep talking to robots?</text><text x="40" y="98" font-size="18" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Agreed: you work between shifts only. You split corporate’s big order into line quotas and the plant budget into line budgets, and move people.</text><text x="40" y="124" font-size="18" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">The worry: that alone is a generic business game. The fun so far is telling AIs what to do and seeing what they make of it. Six ideas to bring that back:</text><rect x="40" y="156" width="560" height="840" rx="14" fill="#1b2330" stroke="#2f3b4f" stroke-width="1"/><text x="64" y="198" font-size="24" fill="#e6e9ef" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Six ideas</text><circle cx="80" cy="242" r="12" fill="#e0b450"/><text x="80" y="247" font-size="14" fill="#10131c" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">1</text><text x="104" y="248" font-size="19" fill="#e6e9ef" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Foremen write a line plan</text><rect x="494" y="226" width="82" height="26" rx="13" fill="#8c92ff" fill-opacity="0.18" stroke="#8c92ff"/><text x="535" y="244" font-size="13" fill="#8c92ff" font-weight="400" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">my pick</text><text x="104" y="276" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">You talk to a foreman; they write the plan their</text><text x="104" y="298" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">line will run. You read it and correct it.</text><circle cx="80" cy="370" r="12" fill="#e0b450"/><text x="80" y="375" font-size="14" fill="#10131c" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">2</text><text x="104" y="376" font-size="19" fill="#e6e9ef" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Foremen push back on quotas</text><rect x="494" y="354" width="82" height="26" rx="13" fill="#8c92ff" fill-opacity="0.18" stroke="#8c92ff"/><text x="535" y="372" font-size="13" fill="#8c92ff" font-weight="400" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">my pick</text><text x="104" y="404" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">“We can do 30, not 40, with this crew.” You argue,</text><text x="104" y="426" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">offer a robot, or back down. Their estimate is real.</text><circle cx="80" cy="498" r="12" fill="#e0b450"/><text x="80" y="503" font-size="14" fill="#10131c" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">3</text><text x="104" y="504" font-size="19" fill="#e6e9ef" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Coaching</text><rect x="494" y="482" width="82" height="26" rx="13" fill="#8c92ff" fill-opacity="0.18" stroke="#8c92ff"/><text x="535" y="500" font-size="13" fill="#8c92ff" font-weight="400" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">my pick</text><text x="104" y="532" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Each foreman has standing instructions for how to</text><text x="104" y="554" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">manage. A talk changes how they run their line.</text><circle cx="80" cy="626" r="12" fill="#e0b450"/><text x="80" y="631" font-size="14" fill="#10131c" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">4</text><text x="104" y="632" font-size="19" fill="#e6e9ef" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">One memo, read differently</text><text x="104" y="660" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">One plant-wide memo; each foreman’s plan shows</text><text x="104" y="682" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">how they read it. Spot who misread you.</text><circle cx="80" cy="754" r="12" fill="#e0b450"/><text x="80" y="759" font-size="14" fill="#10131c" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">5</text><text x="104" y="760" font-size="19" fill="#e6e9ef" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Reports can be wrong</text><text x="104" y="788" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Some foremen are optimistic. Question them and</text><text x="104" y="810" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">check what they say against the numbers.</text><circle cx="80" cy="882" r="12" fill="#e0b450"/><text x="80" y="887" font-size="14" fill="#10131c" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">6</text><text x="104" y="888" font-size="19" fill="#e6e9ef" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Choose foremen by interview</text><text x="104" y="916" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Talk to candidates for a new line; how they</text><text x="104" y="938" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">answer shows how they’d run it.</text><rect x="630" y="156" width="930" height="840" rx="14" fill="#1b2330" stroke="#8c92ff" stroke-width="1.5"/><text x="654" y="198" font-size="24" fill="#e6e9ef" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Ideas 1 + 2 + 3 as one meeting (rough mock)</text><text x="654" y="226" font-size="16" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Between shifts 1 and 2. You meet each foreman; then the plant runs.</text><rect x="654" y="248" width="284" height="50" rx="10" fill="#2a2f5a" stroke="#8c92ff" stroke-width="1"/><g transform="translate(678 274)"><rect x="-11" y="-11" width="22" height="20" rx="6" fill="#c9ced6"/><rect x="-7" y="-6" width="14" height="7" rx="3" fill="#1d2430"/><circle cx="-3" cy="-2.5" r="1.6" fill="#5fd08a"/><circle cx="3" cy="-2.5" r="1.6" fill="#5fd08a"/></g><text x="700" y="279" font-size="15" fill="#e6e9ef" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Doris · Line A</text><text x="924" y="279" font-size="13" fill="#e0b450" font-weight="400" text-anchor="end" font-family="system-ui,-apple-system,sans-serif">at risk</text><rect x="954" y="248" width="284" height="50" rx="10" fill="#141b26" stroke="#2f3b4f" stroke-width="1"/><g transform="translate(978 274)"><rect x="-11" y="-11" width="22" height="20" rx="6" fill="#c9ced6"/><rect x="-7" y="-6" width="14" height="7" rx="3" fill="#1d2430"/><circle cx="-3" cy="-2.5" r="1.6" fill="#5fd08a"/><circle cx="3" cy="-2.5" r="1.6" fill="#5fd08a"/></g><text x="1000" y="279" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Vex · Line B</text><text x="1224" y="279" font-size="13" fill="#5fd08a" font-weight="400" text-anchor="end" font-family="system-ui,-apple-system,sans-serif">on track</text><rect x="1254" y="248" width="284" height="50" rx="10" fill="#141b26" stroke="#2f3b4f" stroke-width="1"/><g transform="translate(1278 274)"><rect x="-11" y="-11" width="22" height="20" rx="6" fill="#c9ced6"/><rect x="-7" y="-6" width="14" height="7" rx="3" fill="#1d2430"/><circle cx="-3" cy="-2.5" r="1.6" fill="#5fd08a"/><circle cx="3" cy="-2.5" r="1.6" fill="#5fd08a"/></g><text x="1300" y="279" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Gary · Line C</text><text x="1524" y="279" font-size="13" fill="#5fd08a" font-weight="400" text-anchor="end" font-family="system-ui,-apple-system,sans-serif">on track</text><rect x="654" y="326" width="882" height="420" rx="10" fill="#141b26" stroke="#2f3b4f" stroke-width="1"/><circle cx="1514" cy="348" r="12" fill="#e0b450"/><text x="1514" y="353" font-size="14" fill="#10131c" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">2</text><g transform="translate(680 378)"><rect x="-11" y="-11" width="22" height="20" rx="6" fill="#c9ced6"/><rect x="-7" y="-6" width="14" height="7" rx="3" fill="#1d2430"/><circle cx="-3" cy="-2.5" r="1.6" fill="#5fd08a"/><circle cx="3" cy="-2.5" r="1.6" fill="#5fd08a"/></g><rect x="700" y="358" width="520" height="58" rx="12" fill="#222b3a" stroke="#2f3b4f" stroke-width="1"/><text x="714" y="383" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Shift 1: 9 boxes. 40 by the end of the quarter</text><text x="714" y="404" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">isn’t happening with three of us. 30, tops.</text><text x="700" y="352" font-size="12" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Doris</text><rect x="1066" y="444" width="450" height="58" rx="12" fill="#2a2f5a" stroke="#8c92ff" stroke-width="1"/><text x="1080" y="469" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">I’ll move Dot over from Line C.</text><text x="1080" y="490" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Can you make 40 with four?</text><text x="1516" y="438" font-size="12" fill="#8f98aa" font-weight="400" text-anchor="end" font-family="system-ui,-apple-system,sans-serif">You</text><g transform="translate(680 526)"><rect x="-11" y="-11" width="22" height="20" rx="6" fill="#c9ced6"/><rect x="-7" y="-6" width="14" height="7" rx="3" fill="#1d2430"/><circle cx="-3" cy="-2.5" r="1.6" fill="#5fd08a"/><circle cx="3" cy="-2.5" r="1.6" fill="#5fd08a"/></g><rect x="700" y="506" width="520" height="37" rx="12" fill="#222b3a" stroke="#2f3b4f" stroke-width="1"/><text x="714" y="531" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">With Dot, 38. Here’s my plan for shift 2.</text><text x="700" y="500" font-size="12" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Doris</text><circle cx="1514" cy="566" r="12" fill="#e0b450"/><text x="1514" y="571" font-size="14" fill="#10131c" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">1</text><rect x="700" y="566" width="790" height="128" rx="10" fill="#18202b" stroke="#2f3b4f" stroke-width="1"/><text x="716" y="592" font-size="14" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Doris’s plan for shift 2</text><text x="716" y="618" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">• Pip and Dot haul. Rex paints, Bo packs.</text><text x="716" y="642" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">• Paint every widget blue until the blue boxes are done.</text><text x="716" y="666" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">• If paint falls behind, I paint too.</text><rect x="710" y="626" width="430" height="24" rx="5" fill="none" stroke="#e5534b" stroke-width="2"/><text x="1154" y="643" font-size="14" fill="#e5534b" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">← too much blue: half the order is red</text><rect x="1066" y="702" width="450" height="37" rx="12" fill="#2a2f5a" stroke="#8c92ff" stroke-width="1"/><text x="1080" y="727" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Only paint what the blue boxes need.</text><text x="1516" y="696" font-size="12" fill="#8f98aa" font-weight="400" text-anchor="end" font-family="system-ui,-apple-system,sans-serif">You</text><circle cx="1514" cy="788" r="12" fill="#e0b450"/><text x="1514" y="793" font-size="14" fill="#10131c" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">3</text><rect x="654" y="766" width="882" height="210" rx="10" fill="#141b26" stroke="#2f3b4f" stroke-width="1"/><text x="670" y="794" font-size="14" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">How Doris manages (her standing instructions)</text><text x="670" y="824" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">• Tell me early when the quota is at risk.</text><text x="670" y="850" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">• Don’t let anyone go without asking me.</text><text x="670" y="876" font-size="15" fill="#5fd08a" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">• Check the order before painting anything.</text><text x="1034" y="876" font-size="14" fill="#5fd08a" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">← added just now, from your correction</text><text x="670" y="916" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">She carries these into every future plan, so the same mistake doesn’t come back.</text><rect x="1292" y="930" width="110" height="32" rx="8" fill="none" stroke="#2f3b4f"/><text x="1347" y="951" font-size="14" fill="#e6e9ef" font-weight="400" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">Next foreman</text><rect x="1410" y="930" width="110" height="32" rx="8" fill="#8c92ff" stroke="#8c92ff"/><text x="1465" y="951" font-size="14" fill="#10131c" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">Run shift</text><text x="1560" y="1026" font-size="13" fill="#8f98aa" font-weight="400" text-anchor="end" font-family="system-ui,-apple-system,sans-serif">rough mocks</text></svg>