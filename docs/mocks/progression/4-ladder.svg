<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372"><rect width="640" height="372" fill="#141a24"/>
<text x="40" y="44" font-size="22" fill="#e6e9ef" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">The ladder</text>
<text x="40" y="66" font-size="13" fill="#8a93a3" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">each rank: what you do, and how big it is</text>
<rect x="40" y="292" width="420" height="56" rx="10" fill="#1e2633" stroke="#334055"/>
  <text x="58" y="327" font-size="20" fill="#8a93a3" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,monospace">0</text>
  <text x="90" y="316" font-size="15" fill="#e6e9ef" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Floor hand</text><text x="90" y="336" font-size="13" fill="#8a93a3" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">do it by hand</text>
  <text x="445" y="325" font-size="12" fill="#8a93a3" font-weight="400" text-anchor="end" font-family="system-ui,-apple-system,sans-serif">the tutorial</text><rect x="80" y="224" width="420" height="56" rx="10" fill="#262c4d" stroke="#7c83ff"/>
  <text x="98" y="259" font-size="20" fill="#7c83ff" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,monospace">1</text>
  <text x="130" y="248" font-size="15" fill="#e6e9ef" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Line lead</text><text x="130" y="268" font-size="13" fill="#8a93a3" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">hire, instruct, then train a foreman</text>
  <text x="485" y="257" font-size="12" fill="#8a93a3" font-weight="400" text-anchor="end" font-family="system-ui,-apple-system,sans-serif">1 line · 2–5 robots</text><rect x="120" y="156" width="420" height="56" rx="10" fill="#1e2633" stroke="#334055"/>
  <text x="138" y="191" font-size="20" fill="#8a93a3" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,monospace">2</text>
  <text x="170" y="180" font-size="15" fill="#e6e9ef" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Plant manager</text><text x="170" y="200" font-size="13" fill="#8a93a3" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">leave the floor, split budgets</text>
  <text x="525" y="189" font-size="12" fill="#8a93a3" font-weight="400" text-anchor="end" font-family="system-ui,-apple-system,sans-serif">2–5 lines · 8–30</text><rect x="160" y="88" width="420" height="56" rx="10" fill="#1e2633" stroke="#334055"/>
  <text x="178" y="123" font-size="20" fill="#8a93a3" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,monospace">3</text>
  <text x="210" y="112" font-size="15" fill="#e6e9ef" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Director</text><text x="210" y="132" font-size="13" fill="#8a93a3" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">set quotas for plant managers</text>
  <text x="565" y="121" font-size="12" fill="#8a93a3" font-weight="400" text-anchor="end" font-family="system-ui,-apple-system,sans-serif">several plants</text>
<text x="510" y="284" font-size="14" fill="#7c83ff" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">← you</text>
<text x="626" y="360" font-size="11" fill="#8a93a3" font-weight="400" text-anchor="end" font-family="system-ui,-apple-system,sans-serif">rough mock</text></svg>