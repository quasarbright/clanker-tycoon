<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"><rect width="1600" height="1000" fill="#121823"/><text x="40" y="62" font-size="32" fill="#e6e9ef" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Instructing robots who instruct robots: one shift, step by step</text><text x="40" y="96" font-size="17" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">You run three lines. Doris is foreman of Line A (paints and boxes). Vex is foreman of Line B (builds crates that need half red, half blue boxes).</text><rect x="40" y="126" width="486.6666666666667" height="400" rx="14" fill="#1b2330" stroke="#2f3b4f" stroke-width="1"/><circle cx="74" cy="160" r="15" fill="#8c92ff"/><text x="74" y="166" font-size="16" fill="#10131c" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">1</text><text x="100" y="167" font-size="20" fill="#e6e9ef" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">You brief Doris</text><text x="64" y="206" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Before the shift. One message, not five robot cards.</text><rect x="100" y="236" width="402.6666666666667" height="77" rx="12" fill="#2a2f5a" stroke="#8c92ff" stroke-width="1"/><text x="114" y="260" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Line B needs mixed crates, half red</text><text x="114" y="281" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">and half blue. Keep blue coming, we</text><text x="114" y="302" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">were short on it last shift.</text><text x="502.6666666666667" y="230" font-size="12" fill="#8f98aa" font-weight="400" text-anchor="end" font-family="system-ui,-apple-system,sans-serif">You</text><g transform="translate(78 370)"><rect x="-11" y="-11" width="22" height="20" rx="6" fill="#c9ced6"/><rect x="-7" y="-6" width="14" height="7" rx="3" fill="#1d2430"/><circle cx="-3" cy="-2.5" r="1.6" fill="#5fd08a"/><circle cx="3" cy="-2.5" r="1.6" fill="#5fd08a"/><path d="M-8 -13 L-8 -20 L-4 -16 L0 -21 L4 -16 L8 -20 L8 -13 Z" fill="#e0b450"/></g><rect x="100" y="352" width="366.6666666666667" height="35" rx="12" fill="#222b3a" stroke="#2f3b4f" stroke-width="1"/><text x="114" y="376" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Got it. I’ll set the crew up.</text><text x="100" y="346" font-size="12" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Doris</text><text x="64" y="456" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Doris is a robot like the rest. She reads</text><text x="64" y="478" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">your words and decides what her crew does.</text><rect x="556.6666666666667" y="126" width="486.6666666666667" height="400" rx="14" fill="#1b2330" stroke="#2f3b4f" stroke-width="1"/><circle cx="590.6666666666667" cy="160" r="15" fill="#8c92ff"/><text x="590.6666666666667" y="166" font-size="16" fill="#10131c" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">2</text><text x="616.6666666666667" y="167" font-size="20" fill="#e6e9ef" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Doris writes her crew’s cards</text><text x="580.6666666666667" y="206" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Her words, on her robots’ cards, like yours used to be.</text><rect x="580.6666666666667" y="230" width="438.6666666666667" height="64" rx="8" fill="#18202b" stroke="#2f3b4f" stroke-width="1"/><g transform="translate(602.6666666666667 262)"><rect x="-11" y="-11" width="22" height="20" rx="6" fill="#c9ced6"/><rect x="-7" y="-6" width="14" height="7" rx="3" fill="#1d2430"/><circle cx="-3" cy="-2.5" r="1.6" fill="#5fd08a"/><circle cx="3" cy="-2.5" r="1.6" fill="#5fd08a"/></g><text x="624.6666666666667" y="254" font-size="12" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Pip · from Doris</text><text x="624.6666666666667" y="276" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Carry widgets from the belt to Paint.</text><rect x="580.6666666666667" y="308" width="438.6666666666667" height="64" rx="8" fill="#18202b" stroke="#e0b450" stroke-width="2"/><g transform="translate(602.6666666666667 340)"><rect x="-11" y="-11" width="22" height="20" rx="6" fill="#c9ced6"/><rect x="-7" y="-6" width="14" height="7" rx="3" fill="#1d2430"/><circle cx="-3" cy="-2.5" r="1.6" fill="#5fd08a"/><circle cx="3" cy="-2.5" r="1.6" fill="#5fd08a"/></g><text x="624.6666666666667" y="332" font-size="12" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Rex · from Doris</text><text x="624.6666666666667" y="354" font-size="15" fill="#e0b450" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Paint every widget blue.</text><rect x="580.6666666666667" y="386" width="438.6666666666667" height="64" rx="8" fill="#18202b" stroke="#2f3b4f" stroke-width="1"/><g transform="translate(602.6666666666667 418)"><rect x="-11" y="-11" width="22" height="20" rx="6" fill="#c9ced6"/><rect x="-7" y="-6" width="14" height="7" rx="3" fill="#1d2430"/><circle cx="-3" cy="-2.5" r="1.6" fill="#5fd08a"/><circle cx="3" cy="-2.5" r="1.6" fill="#5fd08a"/></g><text x="624.6666666666667" y="410" font-size="12" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Bo · from Doris</text><text x="624.6666666666667" y="432" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Box what Rex paints and send it to B.</text><text x="580.6666666666667" y="486" font-size="15" fill="#e0b450" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">She heard “keep blue coming” louder than “half red”.</text><rect x="1073.3333333333335" y="126" width="486.6666666666667" height="400" rx="14" fill="#1b2330" stroke="#2f3b4f" stroke-width="1"/><circle cx="1107.3333333333335" cy="160" r="15" fill="#8c92ff"/><text x="1107.3333333333335" y="166" font-size="16" fill="#10131c" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">3</text><text x="1133.3333333333335" y="167" font-size="20" fill="#e6e9ef" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">It goes wrong downstream</text><text x="1097.3333333333335" y="206" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Mid-shift, on the floor.</text><rect x="1097.3333333333335" y="226" width="150" height="90" rx="10" fill="#18202b" stroke="#2f3b4f" stroke-width="1"/><text x="1109.3333333333335" y="248" font-size="13" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Line A</text><rect x="1386.0000000000002" y="226" width="150" height="90" rx="10" fill="#18202b" stroke="#2f3b4f" stroke-width="1"/><text x="1398.0000000000002" y="248" font-size="13" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Line B</text><rect x="1247.3333333333335" y="276" width="138.66666666666669" height="12" rx="4" fill="#2a3444"/><rect x="1253.3333333333335" y="248" width="16" height="14" rx="2" fill="#4a8cff" stroke="#0008"/><rect x="1271.3333333333335" y="248" width="16" height="14" rx="2" fill="#4a8cff" stroke="#0008"/><rect x="1289.3333333333335" y="248" width="16" height="14" rx="2" fill="#4a8cff" stroke="#0008"/><rect x="1307.3333333333335" y="248" width="16" height="14" rx="2" fill="#4a8cff" stroke="#0008"/><rect x="1253.3333333333335" y="263" width="16" height="14" rx="2" fill="#4a8cff" stroke="#0008"/><rect x="1271.3333333333335" y="263" width="16" height="14" rx="2" fill="#4a8cff" stroke="#0008"/><rect x="1289.3333333333335" y="263" width="16" height="14" rx="2" fill="#4a8cff" stroke="#0008"/><rect x="1307.3333333333335" y="263" width="16" height="14" rx="2" fill="#4a8cff" stroke="#0008"/><rect x="1253.3333333333335" y="278" width="16" height="14" rx="2" fill="#4a8cff" stroke="#0008"/><rect x="1271.3333333333335" y="278" width="16" height="14" rx="2" fill="#4a8cff" stroke="#0008"/><rect x="1289.3333333333335" y="278" width="16" height="14" rx="2" fill="#4a8cff" stroke="#0008"/><rect x="1307.3333333333335" y="278" width="16" height="14" rx="2" fill="#4a8cff" stroke="#0008"/><text x="1316.6666666666667" y="340" font-size="13" fill="#4a8cff" font-weight="400" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">blue boxes pile up, no red</text><g transform="translate(1111.3333333333335 396)"><rect x="-11" y="-11" width="22" height="20" rx="6" fill="#c9ced6"/><rect x="-7" y="-6" width="14" height="7" rx="3" fill="#1d2430"/><circle cx="-3" cy="-2.5" r="1.6" fill="#5fd08a"/><circle cx="3" cy="-2.5" r="1.6" fill="#5fd08a"/><path d="M-8 -13 L-8 -20 L-4 -16 L0 -21 L4 -16 L8 -20 L8 -13 Z" fill="#e0b450"/></g><rect x="1133.3333333333335" y="376" width="402.6666666666667" height="56" rx="12" fill="#222b3a" stroke="#e5534b" stroke-width="2"/><text x="1147.3333333333335" y="400" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">No red boxes for 40 seconds. I can’t</text><text x="1147.3333333333335" y="421" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">build a single crate.</text><text x="1133.3333333333335" y="370" font-size="12" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Vex comes to your desk</text><rect x="40" y="556" width="486.6666666666667" height="400" rx="14" fill="#1b2330" stroke="#2f3b4f" stroke-width="1"/><circle cx="74" cy="590" r="15" fill="#8c92ff"/><text x="74" y="596" font-size="16" fill="#10131c" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">4</text><text x="100" y="597" font-size="20" fill="#e6e9ef" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">You trace it back</text><text x="64" y="636" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Follow the boxes upstream and open the robot.</text><text x="64" y="676" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Line B is starved  →  Line A sends only blue</text><text x="64" y="702" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">→  Rex paints everything  →  Rex’s card says:</text><rect x="64" y="722" width="438.6666666666667" height="64" rx="8" fill="#18202b" stroke="#e5534b" stroke-width="2"/><g transform="translate(86 754)"><rect x="-11" y="-11" width="22" height="20" rx="6" fill="#c9ced6"/><rect x="-7" y="-6" width="14" height="7" rx="3" fill="#1d2430"/><circle cx="-3" cy="-2.5" r="1.6" fill="#5fd08a"/><circle cx="3" cy="-2.5" r="1.6" fill="#5fd08a"/></g><text x="108" y="746" font-size="12" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Rex · from Doris</text><text x="108" y="768" font-size="15" fill="#e5534b" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Paint every widget blue.</text><text x="64" y="826" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Rex did exactly what he was told.</text><text x="64" y="850" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">The mistake is in what Doris told him,</text><text x="64" y="874" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">and under that, in what you told Doris.</text><rect x="556.6666666666667" y="556" width="486.6666666666667" height="400" rx="14" fill="#1b2330" stroke="#2f3b4f" stroke-width="1"/><circle cx="590.6666666666667" cy="590" r="15" fill="#8c92ff"/><text x="590.6666666666667" y="596" font-size="16" fill="#10131c" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">5</text><text x="616.6666666666667" y="597" font-size="20" fill="#e6e9ef" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">You fix it through Doris</text><rect x="616.6666666666667" y="632" width="402.6666666666667" height="56" rx="12" fill="#2a2f5a" stroke="#8c92ff" stroke-width="1"/><text x="630.6666666666667" y="656" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Half the widgets stay red. Only paint</text><text x="630.6666666666667" y="677" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">enough for the blue half of the crates.</text><text x="1019.3333333333335" y="626" font-size="12" fill="#8f98aa" font-weight="400" text-anchor="end" font-family="system-ui,-apple-system,sans-serif">You</text><g transform="translate(594.6666666666667 734)"><rect x="-11" y="-11" width="22" height="20" rx="6" fill="#c9ced6"/><rect x="-7" y="-6" width="14" height="7" rx="3" fill="#1d2430"/><circle cx="-3" cy="-2.5" r="1.6" fill="#5fd08a"/><circle cx="3" cy="-2.5" r="1.6" fill="#5fd08a"/><path d="M-8 -13 L-8 -20 L-4 -16 L0 -21 L4 -16 L8 -20 L8 -13 Z" fill="#e0b450"/></g><rect x="616.6666666666667" y="716" width="366.6666666666667" height="35" rx="12" fill="#222b3a" stroke="#2f3b4f" stroke-width="1"/><text x="630.6666666666667" y="740" font-size="15" fill="#e6e9ef" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">My mistake. Telling Rex now.</text><text x="616.6666666666667" y="710" font-size="12" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Doris</text><rect x="580.6666666666667" y="770" width="438.6666666666667" height="64" rx="8" fill="#18202b" stroke="#5fd08a" stroke-width="2"/><g transform="translate(602.6666666666667 802)"><rect x="-11" y="-11" width="22" height="20" rx="6" fill="#c9ced6"/><rect x="-7" y="-6" width="14" height="7" rx="3" fill="#1d2430"/><circle cx="-3" cy="-2.5" r="1.6" fill="#5fd08a"/><circle cx="3" cy="-2.5" r="1.6" fill="#5fd08a"/></g><text x="624.6666666666667" y="794" font-size="12" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Rex · from Doris</text><text x="624.6666666666667" y="816" font-size="15" fill="#5fd08a" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Paint every other widget blue.</text><text x="580.6666666666667" y="866" font-size="14" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Doris’s standing instructions gain a line:</text><text x="580.6666666666667" y="890" font-size="15" fill="#5fd08a" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">“Check the mix the next line needs before painting.”</text><text x="580.6666666666667" y="918" font-size="14" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">So she doesn’t make that mistake again.</text><rect x="1073.3333333333335" y="556" width="486.6666666666667" height="400" rx="14" fill="#1b2330" stroke="#5fd08a" stroke-width="1.5"/><circle cx="1107.3333333333335" cy="590" r="15" fill="#5fd08a"/><text x="1107.3333333333335" y="596" font-size="16" fill="#10131c" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">?</text><text x="1133.3333333333335" y="597" font-size="20" fill="#e6e9ef" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Why bother with foremen?</text><text x="1097.3333333333335" y="652" font-size="17" fill="#5fd08a" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Reach.</text><text x="1097.3333333333335" y="678" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">You can’t write 30 robots’ cards every</text><text x="1097.3333333333335" y="700" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">shift. One briefing sets up a whole line.</text><text x="1097.3333333333335" y="744" font-size="17" fill="#5fd08a" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Surprises.</text><text x="1097.3333333333335" y="770" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Mid-shift, Doris handles her line’s</text><text x="1097.3333333333335" y="792" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">problems without you, like workers do.</text><text x="1097.3333333333335" y="836" font-size="17" fill="#5fd08a" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">A new skill.</text><text x="1097.3333333333335" y="862" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">Saying what you mean so it survives</text><text x="1097.3333333333335" y="884" font-size="15" fill="#8f98aa" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,sans-serif">being retold, and finding where it didn’t.</text><text x="1560" y="986" font-size="13" fill="#8f98aa" font-weight="400" text-anchor="end" font-family="system-ui,-apple-system,sans-serif">rough mocks</text></svg>